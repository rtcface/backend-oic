version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: mongodb_oic
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  oic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oic_backend
    restart: always
    ports:
      - "5005:3000"
    environment:
      - APP_PORT=3000
      - MONGO_CNN=mongodb://root:123456@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb

volumes:
  mongo_data:
